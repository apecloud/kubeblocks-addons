apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: app-pool-rw
  namespace: demo
spec:
  clusterDef: pgbouncer
  topology: pgbouncer
  terminationPolicy: Delete
  componentSpecs:
    - name: pgbouncer
      serviceVersion: "1.26.1"
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        - name: PGBOUNCER_BACKEND_ROLE
          value: rw
      serviceRefs:
        - name: postgresql
          namespace: demo
          clusterServiceSelector:
            cluster: pg-cluster
            service:
              component: postgresql
              service: postgresql
              port: tcp-postgresql
            credential:
              component: postgresql
              name: postgres
