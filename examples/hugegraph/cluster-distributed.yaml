apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: hugegraph-distributed
  namespace: demo
spec:
  clusterDef: hugegraph
  topology: distributed
  terminationPolicy: Delete
  componentSpecs:
    - name: pd
      serviceVersion: "1.7.0"
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: "500m"
          memory: 1Gi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: ""
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
    - name: store
      serviceVersion: "1.7.0"
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: "500m"
          memory: 1Gi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: ""
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
    - name: server
      serviceVersion: "1.7.0"
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: "500m"
          memory: 1Gi
