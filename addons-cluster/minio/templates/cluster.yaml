apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: {{ include "kblib.clusterName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kblib.clusterLabels" . | nindent 4 }}
spec:
  terminationPolicy: {{ .Values.extra.terminationPolicy }}
  componentSpecs:
    - componentDef: minio
      name: minio
      replicas: {{ .Values.replicas }}
      {{- with .Values.storageClass }}
      annotations:
        config.kubeblocks.io/custom-template: {{ dict "storage-class" (dict "templateRef" (printf "%s-minio-storage-class-template" (include "kblib.clusterName" $)) "namespace" $.Release.Namespace "policy" "replace") | toJson | quote }}
      {{- end }}
      env:
      - name: MINIO_BUCKETS
        value: {{ .Values.buckets }}
      {{- include "kblib.componentMonitor" . | indent 6 }}
      {{- include "kblib.componentResources" . | indent 6 }}
      {{- include "kblib.componentStorages" . | indent 6 }}
