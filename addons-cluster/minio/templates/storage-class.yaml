{{- with .Values.storageClass }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kblib.clusterName" $ }}-minio-storage-class-template
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kblib.clusterLabels" $ | nindent 4 }}
    app.kubernetes.io/managed-by: kubeblocks
    apps.kubeblocks.io/component-name: minio
data:
  storage-class.json: {{ dict "apply_request" (dict "requestID" "initial" "parameters" . | toJson) | toJson | quote }}
{{- end }}
