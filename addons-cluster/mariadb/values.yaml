# Default values for mariadb-cluster
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## @param mode cluster topology: standalone, replication, or galera.
mode: standalone
## @param version MARIADB cluster version
##
version: 10.6.15

## @param replicas specify cluster replicas. standalone is forced to 1.
##
replicas: 1

## @param cpu
##
cpu: 0.5

## @param memory, the unit is Gi
##
memory: 0.5

## @param requests.cpu if not set, use cpu
## @param requests.memory, if not set, use memory
##
requests:
#  cpu:
#  memory:

## @param storage size, the unit is Gi
##
storage: 20
