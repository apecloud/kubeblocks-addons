{{ if not .Values.remoteSetting.isStandby }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kblib.clusterName" . }}-certificates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
data:
{{- if .Values.certificates.custom }}
  dbm_certificate.cer: {{ .Values.certificates.cert }}
  dbm_certificate.pvk: {{ .Values.certificates.privateKey }}
  dbm_certificate.pfx:  {{ .Values.certificates.pfx }}
  private_key_password: {{ .Values.certificates.password | b64enc | quote }}
{{- else }}
{{- /* Reuse the existing secret on upgrade so the dbm certificate and private-key
     password are only generated once. SQL Server creates the in-engine
     dbm_certificate from the initial material; regenerating it on every render
     breaks HADR endpoint certificate authentication for scaled-out replicas.
     Note: lookup returns empty on `helm template`/dry-run, so rendering always
     shows the generate path there. */}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-certificates" (include "kblib.clusterName" .)) }}
{{- if $existingSecret }}
{{- range $key, $value := $existingSecret.data }}
  {{ $key }}: {{ $value }}
{{- end }}
{{- else }}
{{- $cert := genSelfSignedCert (include "kblib.clusterName" .) (list) (list) 36500 }}
  dbm_certificate.crt: {{ $cert.Cert | b64enc }}
  dbm_certificate.key: {{ $cert.Key | b64enc }}
  private_key_password: {{ include "mssql.generate_pk_password" . | b64enc | quote}}
{{- end }}
{{- end }}
{{- end }}
