# Override the name of the chart
nameOverride: ""
# Override the full name of the chart
fullnameOverride: ""

## Clickhouse cluster version
version: 25.9.7

## ClickHouse cluster topology mode defined in ClusterDefinition.Spec.topologies, support standalone, cluster and withZookeeper
## - `standalone`: single clickhouse instance
## - `cluster`: clickhouse with ClickHouse Keeper as coordinator
## - `withZookeeper`: clickhouse coordinated by external ZooKeeper clusters
##   referenced via serviceRef (see the `zookeeper` section below), no embedded
##   ClickHouse Keeper. The zookeeper serviceRefs are rendered only in this mode.
mode: cluster

## Sharding configuration
shards: 2

## Number of ClickHouse replicas per shard to deploy
replicas: 2

## ClickHouse per shard component configurations
cpu: 0.5
memory: 1

## CPU and memory requests for the ClickHouse shard
requests:
# cpu: ""
# memory: ""

storageClassName: ""
storage: 20
disableExporter: false

## Tolerations for ClickHouse pods assignment
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## ClickHouse Keeper configuration
keeper:
  ## Number of ClickHouse Keeper replicas
  replicas: 1
  storageClassName: ""
  cpu: 1
  memory: 2
  storage: 10
  tolerations: []

## External ZooKeeper clusters referenced via serviceRef.
## When a primary ZooKeeper is referenced, it replaces ClickHouse Keeper as the
## default <zookeeper> for replicated tables, and all pod FQDNs of the
## referenced cluster are rendered as <node> entries.
## Auxiliary ZooKeeper clusters (up to 7) are rendered into
## <auxiliary_zookeepers>, referenced by replicated tables/databases, e.g.
## ReplicatedMergeTree('zookeeper2:/path', 'replica').
##
## To use, set mode: cluster and reference existing ZooKeeper clusters:
##   zookeeper:
##     primary:
##       namespace: demo
##       cluster: zk-cluster
##       component: zookeeper
##       service: default
##       port: client
##     auxiliary:
##       - name: zk-aux-1
##         namespace: demo
##         cluster: zk-cluster-aux-1
##         component: zookeeper
##         service: default
##         port: client
##       - name: zk-aux-2
##         namespace: demo
##         cluster: zk-cluster-aux-2
##         component: zookeeper
##         service: default
##         port: client
zookeeper:
  primary:
    namespace: ""
    cluster: ""
    component: zookeeper
    port: client
  ## up to 7 auxiliary zookeeper clusters
  auxiliary: []

clickhouse:
  initClusterName: "default"

## Service configurations
service:
  ## ClickHouse service type
  ## Valid options are ExternalName, ClusterIP, NodePort, and LoadBalancer.
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP

## TLS configuration for ClickHouse cluster
tls:
  enabled: false
  ## KubeBlocks or UserProvided
  issuer: UserProvided
  ## If issuer is UserProvided, will automatically generate TLS file by cluster-tls-secrets.yaml
  secretName: clickhouse-cluster-tls

extra:
  ## Define Cluster termination policy.
  ## Options: DoNotTerminate, Delete, WipeOut.
  terminationPolicy: Delete
