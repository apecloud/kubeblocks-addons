name: Release Chart Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'The version of release chart image'
        required: true
        default: ''
      ADD_ADDONS:
        description: "The filter addons to release"
        type: string
        required: false
        default: ''
      MANIFEST_ADDONS:
        description: "The addon chart versions from the release manifest"
        type: string
        required: false
        default: ''
      CLOUD_SUFFIX:
        description: "Enable image tags include the version"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      VERSION:
        description: 'The version of release chart image'
        type: string
        required: false
        default: ''
      ADD_ADDONS:
        description: "The filter addons to release"
        type: string
        required: false
        default: ''
      MANIFEST_ADDONS:
        description: "The addon chart versions from the release manifest"
        type: string
        required: false
        default: ''
      CLOUD_SUFFIX:
        description: "Enable image tags include the version"
        type: boolean
        required: false
        default: false

run-name: release chart image ${{ inputs.VERSION }}

jobs:
  release-charts-image:
    uses: apecloud/apecloud-cd/.github/workflows/release-image-cache2.yml@v0.2.19
    with:
      IMG: "apecloud/apecloud-addon-charts"
      VERSION: "${{ inputs.VERSION }}"
      APECD_REF: "v0.2.19"
      DOCKERFILE_PATH: "./docker/Dockerfile-charts"
      REMOVE_PREFIX: false
      ADD_ADDONS: "${{ inputs.ADD_ADDONS }}"
      MANIFEST_ADDONS: "${{ inputs.MANIFEST_ADDONS }}"
      CLOUD_SUFFIX: ${{ inputs.CLOUD_SUFFIX }}
    secrets: inherit
