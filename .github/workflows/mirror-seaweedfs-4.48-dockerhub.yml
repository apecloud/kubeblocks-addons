name: Mirror SeaweedFS 4.48 to Docker Hub

on:
  workflow_dispatch:

run-name: mirror SeaweedFS 4.48 to Docker Hub

env:
  SOURCE_IMAGE: docker.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  DESTINATION_IMAGE: docker.io/apecloud/seaweedfs:4.48
  EXPECTED_DIGEST: sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install Skopeo and jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq skopeo
          skopeo --version

      - name: Copy SeaweedFS 4.48 with Skopeo
        env:
          DOCKERHUB_REGISTRY: docker.io
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_PASSWORD" | skopeo login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin "$DOCKERHUB_REGISTRY"
          skopeo copy --all --retry-times 3 \
            "docker://${SOURCE_IMAGE}" \
            "docker://${DESTINATION_IMAGE}"

      - name: Verify the Docker Hub manifest digest
        run: |
          set -euo pipefail
          raw_manifest="$(mktemp)"
          trap 'rm -f "$raw_manifest"' EXIT
          skopeo inspect --raw "docker://${DESTINATION_IMAGE}" > "$raw_manifest"
          actual_digest="sha256:$(sha256sum "$raw_manifest" | cut -d' ' -f1)"
          echo "Docker Hub manifest digest: ${actual_digest}"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          jq -e '
            if .manifests then
              any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")
            else
              .os == "linux" and .architecture == "amd64"
            end
          ' "$raw_manifest" >/dev/null
