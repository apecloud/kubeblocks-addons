apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: mssql-bcp-br
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
spec:
  backupType: Selective
  parametersSchema:
    openAPIV3Schema:
      properties:
        tables:
          type: string
          description: "The tables/views to backup or restore, separated by comma. Use format db.schema.table|view. For instance: db1.dbo.t1,db1.dbo.t2,db2.sales.v_report"
        format:
          type: string
          description: "The bcp export format. 'char' for character format (portable), 'native' for native format (faster, SQL Server only)."
          default: "char"
        batch_size:
          type: number
          description: "The number of rows per batch for bcp import."
          default: 10000
        clean_table:
          type: boolean
          description: "Whether to clean (truncate) the table before importing data."
          default: false
  backup:
    preBackup: []
    postBackup: []
    withParameters:
      - tables
      - format
    backupData:
      image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
      runOnTargetPodNode: true
      command:
      - bash
      - -c
      - |
        {{- .Files.Get "dataprotection/bcp-export.sh" | nindent 8 }}
      syncProgress:
        enabled: true
        intervalSeconds: 5
  restore:
    withParameters:
      - tables
      - batch_size
      - clean_table
    postReady:
    - job:
        image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        runOnTargetPodNode: true
        command:
        - bash
        - -c
        - |
          {{- .Files.Get "dataprotection/bcp-import.sh" | nindent 10 }}
