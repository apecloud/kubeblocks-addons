{{/*
Valkey Sentinel ComponentDefinition.

Architecture note:
  Sentinel is a separate process (not a library) that monitors Valkey primary
  instances and orchestrates automatic failover.  It runs as a distinct
  Kubernetes component alongside the data component.

  - 3 replicas (quorum = 2) are the minimum for a production deployment.
  - Sentinel has NO roles — all instances are equal peers.
  - Sentinel stores its state in /data/sentinel/redis-sentinel.conf, which is
    rewritten by Valkey on failover.  Persisting it on a PVC means a restarted
    Sentinel immediately knows which node is the current master.
  - The data component's postProvision action registers the initial primary with
    all Sentinel pods (see scripts/valkey-register-to-sentinel.sh).
*/}}
{{- range .Values.valkeyVersions }}
---
apiVersion: apps.kubeblocks.io/v1
kind: ComponentDefinition
metadata:
  name: {{ .sentinelComponentDef }}
  labels:
    {{- include "valkey.labels" $ | nindent 4 }}
  annotations:
    {{- include "valkey.annotations" $ | nindent 4 }}
spec:
  provider: community
  description: Valkey Sentinel v{{ .major }}.x — HA monitor and failover orchestrator
  serviceKind: valkey-sentinel
  # Parallel: all Sentinel pods start concurrently.  There is no ordering
  # dependency between Sentinel peers — they elect a leader among themselves.
  podManagementPolicy: Parallel
  podUpgradePolicy: ReCreate
  updateStrategy: BestEffortParallel
  minReadySeconds: 10

  # Sentinel state is persisted in the data volume so the conf survives restarts.
  volumes:
    - name: data
      needSnapshot: false   # Sentinel conf is small; snapshot is not needed

  services:
    # Shared ClusterIP service — clients connect to any Sentinel pod.
    - name: valkey-sentinel
      serviceName: valkey-sentinel
      spec:
        ports:
          - name: valkey-sentinel
            port: 26379
            targetPort: valkey-sentinel
    # Per-pod NodePort (opt-in) for external Sentinel clients.
    - name: sentinel-advertised
      serviceName: sentinel-advertised
      spec:
        type: NodePort
        ports:
          - name: sentinel-advertised
            port: 26379
            targetPort: valkey-sentinel
      podService: true
      disableAutoProvision: true
    - name: sentinel-lb-advertised
      serviceName: sentinel-lb-advertised
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        # allocateLoadBalancerNodePorts: false
        ports:
          - name: sentinel-advertised
            port: 26379
            targetPort: redis-sentinel
      podService: true
      disableAutoProvision: true

  tls:
    volumeName: tls
    mountPath: {{ $.Values.tlsMountPath }}
    caFile: ca.crt
    certFile: tls.crt
    keyFile: tls.key

  scripts:
    - name: valkey-scripts
      template: {{ include "valkey.scriptsTemplate" $ }}
      namespace: {{ $.Release.Namespace }}
      volumeName: scripts
      defaultMode: 0555

  systemAccounts:
    - name: default
      initAccount: true
      passwordGenerationPolicy:
        length: 16
        numDigits: 8
        numSymbols: 0
        letterCase: MixedCases

  hostNetwork:
    containerPorts:
      - container: valkey-sentinel
        ports:
          - valkey-sentinel

  vars:
    - name: CLUSTER_NAME
      valueFrom:
        clusterVarRef:
          clusterName: Required
    - name: CLUSTER_NAMESPACE
      valueFrom:
        clusterVarRef:
          namespace: Required
    - name: CLUSTER_DOMAIN
      value: "{{ $.Values.clusterDomain }}"
    # Sentinel's own credentials (used for inter-Sentinel auth)
    - name: SENTINEL_USER
      valueFrom:
        credentialVarRef:
          name: default
          username: Required
    - name: SENTINEL_PASSWORD
      valueFrom:
        credentialVarRef:
          name: default
          password: Required
    - name: SENTINEL_POD_NAME_LIST
      valueFrom:
        componentVarRef:
          podNames: Required
    - name: SENTINEL_POD_FQDN_LIST
      valueFrom:
        componentVarRef:
          podFQDNs: Required
    # NodePort announce address (for external clients, opt-in)
    - name: VALKEY_SENTINEL_ADVERTISED_PORT
      valueFrom:
        serviceVarRef:
          name: sentinel-advertised
          optional: true
          port:
            name: sentinel-advertised
            option: Required
    - name: VALKEY_SENTINEL_ADVERTISED_SVC_NAME
      valueFrom:
        serviceVarRef:
          name: sentinel-advertised
          optional: true
          host: Required
    # Host-network dynamic port
    - name: VALKEY_SENTINEL_HOST_NETWORK_PORT
      valueFrom:
        hostNetworkVarRef:
          optional: true
          container:
            name: valkey-sentinel
            port:
              name: valkey-sentinel
    - name: VALKEY_SENTINEL_LB_ADVERTISED_HOST
      valueFrom:
        serviceVarRef:
          name: sentinel-lb-advertised
          optional: true
          loadBalancer: Required
          host: Required
    - name: VALKEY_SENTINEL_LB_ADVERTISED_PORT
      valueFrom:
        serviceVarRef:
          name: sentinel-lb-advertised
          optional: true
          port:
            name: sentinel-advertised
            option: Required
    - name: SENTINEL_SERVICE_PORT
      value: "26379"
      expression: {{ `{{if index . "VALKEY_SENTINEL_HOST_NETWORK_PORT"}}{{.VALKEY_SENTINEL_HOST_NETWORK_PORT}}{{else}}{{.SENTINEL_SERVICE_PORT}}{{end}}` | toYaml }}
    # Cross-component vars — used by _background_monitor_discovery() in valkey-sentinel-start.sh
    # to auto-discover the master when all sentinels restart simultaneously (upgrade/chaos).
    - name: VALKEY_COMPONENT_NAME
      valueFrom:
        componentVarRef:
          compDef: {{ .componentDef }}
          optional: true
          componentName: Required
    - name: VALKEY_POD_FQDN_LIST
      valueFrom:
        componentVarRef:
          compDef: {{ .componentDef }}
          optional: true
          podFQDNs: Required
    # Used by the memberJoin action (scripts/valkey-sentinel-member-join.sh):
    # a joining Sentinel probes the data pods for the current primary and falls
    # back to the lowest ordinal pod from this list when none answers.
    - name: VALKEY_POD_NAME_LIST
      valueFrom:
        componentVarRef:
          compDef: {{ .componentDef }}
          optional: true
          podNames: Required
    # NodePort mapping of the data pods ("podSvc:nodeport,..."). memberJoin
    # registers the same host:nodeport address the data side registered, so a
    # Sentinel never hands clients a different master address.
    - name: VALKEY_ADVERTISED_PORT
      valueFrom:
        serviceVarRef:
          compDef: {{ .componentDef }}
          name: valkey-advertised
          optional: true
          port:
            name: valkey-advertised
            option: Required
    # LoadBalancer advertised service of the data pods ("svc:host",... /
    # single host:port) — used by the memberJoin action to register the same
    # LB address the data side registered (redis addon parity).
    - name: VALKEY_LB_ADVERTISED_PORT
      valueFrom:
        serviceVarRef:
          compDef: {{ .componentDef }}
          name: valkey-lb-advertised
          optional: true
          port:
            name: valkey-advertised
            option: Required
    - name: VALKEY_LB_ADVERTISED_HOST
      valueFrom:
        serviceVarRef:
          compDef: {{ .componentDef }}
          name: valkey-lb-advertised
          optional: true
          loadBalancer: Required
          host: Required
    - name: VALKEY_DEFAULT_PASSWORD
      valueFrom:
        credentialVarRef:
          compDef: {{ .componentDef }}
          name: default
          optional: true
          password: Required
    - name: SERVICE_PORT
      value: "6379"
    - name: TLS_ENABLED
      valueFrom:
        tlsVarRef:
          enabled: Optional
          optional: true
    - name: TLS_MOUNT_PATH
      value: {{ $.Values.tlsMountPath }}
    # Verify the server certificate against the mounted CA instead of
    # skipping verification (see cmpd.yaml for the SAN contract).
    - name: VALKEY_CLI_TLS_ARGS
      value: ""
      expression: {{ `{{if eq (index . "TLS_ENABLED") "true"}}--tls --insecure{{else}}{{end}}` | toYaml }}

  lifecycleActions:
    accountProvision:
      exec:
        container: valkey-sentinel
        command: [bash, -c, /scripts/valkey-sentinel-account-provision.sh]
        targetPodSelector: All

    # memberJoin: called on the pod that just joined the component when the
    # Sentinel component is scaled out (3 → 5 Sentinels). A brand-new Sentinel
    # starts with an empty state — no monitor stanza — so it neither counts for
    # quorum nor can it vote in an election. The joined pod registers the
    # current data primary with its own Sentinel process (SENTINEL MONITOR +
    # the same failover tunables the other registration paths use); peer
    # Sentinels discover the new node through the pub/sub HELLO channel, so no
    # cross-registration is needed. See scripts/valkey-sentinel-member-join.sh.
    # timeoutSeconds: the script waits up to 3 × 5s for the local Sentinel to
    # answer PING before failing closed, so the default 30s is too tight.
    memberJoin:
      timeoutSeconds: 60
      exec:
        container: valkey-sentinel
        command:
          - /bin/bash
          - -c
          - /scripts/valkey-sentinel-member-join.sh
        targetPodSelector: Any
        ## all lifecycle actions share the same env: KubeBlocks merges every
        ## action's exec.env onto the kbagent sidecar container, which is what
        ## actually executes the actions — the valkey-sentinel container's own
        ## fieldRef envs are NOT visible to them.  Without CURRENT_POD_HOST_IP
        ## here, the member-join script degrades the monitor address to the
        ## pod FQDN, which a Sentinel without `sentinel resolve-hostnames yes`
        ## rejects (redis addon parity: same block on its memberLeave).
        env:
          - name: CURRENT_POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: CURRENT_POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: CURRENT_POD_HOST_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.hostIP

    # memberLeave: called when a Sentinel pod is leaving the component
    # (scale-in, pod removal).  Same flow as the redis addon's
    # redis-sentinel-member-leave.sh: the leaving Sentinel REMOVES its monitor
    # stanzas (stops campaigning/announcing immediately), every remaining
    # Sentinel RESETs (drops the leaver from the known-sentinel lists without
    # waiting for HELLO gossip), and the script fails closed when the remaining
    # nodes disagree about num-other-sentinels.  Note: this is the Sentinel
    # component's own leave — the data component deliberately has NO
    # memberLeave (Sentinel self-heals the data topology).
    # timeoutSeconds: worst case is remove (3×1s) + reset per peer (3×1s + 3s
    # settle, up to 4 peers) + agreement (3×1s per peer) — 120s covers it with
    # headroom.
    memberLeave:
      timeoutSeconds: 120
      exec:
        container: valkey-sentinel
        command:
          - /bin/bash
          - -c
          - /scripts/valkey-sentinel-member-leave.sh > /tmp/member-leave.log 2>&1
        targetPodSelector: Any

  runtime:
    containers:
      - name: valkey-sentinel
        imagePullPolicy: IfNotPresent
        ports:
          - name: valkey-sentinel
            containerPort: 26379
        volumeMounts:
          - name: data
            mountPath: /data
          - name: scripts
            mountPath: /scripts
        env:
          - name: CURRENT_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: CURRENT_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: CURRENT_POD_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        command:
          - /bin/bash
          - -c
          - /scripts/valkey-sentinel-start.sh
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
          exec:
            command: [bash, -c, /scripts/valkey-sentinel-ping.sh]
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
          exec:
            command: [bash, -c, /scripts/valkey-sentinel-ping.sh]
{{- end }}
