{{/*
ParametersDefinition (PD) — released KubeBlocks 1.0 shape
(parameters.kubeblocks.io/v1alpha1).

A PD carries only the engine-side parameter semantics: the config file name,
the CUE schema, the static/immutable/dynamic classification and the reload
action.  Anything that binds a PD to a component — componentDef, templateName,
fileFormatConfig — belongs to the ParamConfigRenderer (see pcr-valkey.yaml).
Those three fields used to live here, but they only exist in an unreleased
KubeBlocks API and are rejected by the 1.0 CRDs.

reloadAction mirrors the other add-ons (redis, mysql, orioledb): a shellTrigger
that KubeBlocks invokes once per changed parameter as

    reload-parameter.sh <parameter-name> <value>

inside the config-manager sidecar.  The sidecar runs the Valkey image
(asContainerImage: true), so valkey-cli — which reload-parameter.sh uses to
issue CONFIG SET — is available in it, and the component env vars
(SERVICE_PORT, VALKEY_DEFAULT_PASSWORD, VALKEY_CLI_TLS_ARGS) are injected into
it by KubeBlocks.
*/}}
{{- $registry := .Values.image.registry | default "docker.io" }}
{{- $repository := .Values.image.repository }}
{{- range .Values.valkeyVersions }}
---
apiVersion: parameters.kubeblocks.io/v1alpha1
kind: ParametersDefinition
metadata:
  name: {{ printf "valkey%s-pd" .major }}
  labels:
    {{- include "valkey.labels" $ | nindent 4 }}
  annotations:
    {{- include "valkey.annotations" $ | nindent 4 }}
spec:
  reloadAction:
    shellTrigger:
      sync: true
      command:
        - "reload-parameter.sh"
      scriptConfig:
        scriptConfigMapRef: {{ include "valkey.reloadToolsScript" $ }}
        namespace: {{ $.Release.Namespace }}
      toolsSetup:
        mountPoint: /kb_tools
        toolConfigs:
          - name: kb-tools
            asContainerImage: true
            # The serviceVersion of the component decides which image is used,
            # see imageMappings below.
            image: {{ printf "%s/%s:%s" $registry $repository .defaultImageTag }}
            imageMappings:
              {{- range .mirrorVersions }}
              - serviceVersions:
                  - {{ .version }}
                image: {{ printf "%s/%s:%s" $registry $repository .imageTag }}
              {{- end }}

  fileName: valkey.conf
  immutableParameters:
    - dir
    - dbfilename
    - appendfilename
    - appenddirname
  staticParameters:
    - bind
    - port
    - tls-port
    - daemonize
    - databases
    - logfile
    - aclfile
    - tcp-backlog
    - io-threads
    - io-threads-do-reads
  dynamicParameters:
    - acllog-max-len
    - activedefrag
    - active-defrag-cycle-max
    - active-defrag-cycle-min
    - active-defrag-ignore-bytes
    - active-expire-effort
    - appendfsync
    - appendonly
    - auto-aof-rewrite-min-size
    - auto-aof-rewrite-percentage
    - hash-max-listpack-entries
    - hash-max-listpack-value
    - hll-sparse-max-bytes
    - lazyfree-lazy-eviction
    - lazyfree-lazy-expire
    - lazyfree-lazy-server-del
    - lazyfree-lazy-user-del
    - lfu-decay-time
    - lfu-log-factor
    - list-compress-depth
    - list-max-listpack-size
    - loglevel
    - maxclients
    - maxmemory
    - maxmemory-policy
    - maxmemory-samples
    - min-replicas-max-lag
    - min-replicas-to-write
    - notify-keyspace-events
    - proto-max-bulk-len
    - rdb-del-sync-files
    - rdbchecksum
    - rdbcompression
    - replica-lazy-flush
    - replica-priority
    - replica-read-only
    - replica-serve-stale-data
    - repl-backlog-size
    - repl-backlog-ttl
    - repl-diskless-load
    - repl-diskless-sync
    - repl-diskless-sync-delay
    - repl-disable-tcp-nodelay
    - repl-timeout
    - save
    - set-max-intset-entries
    - set-max-listpack-entries
    - set-max-listpack-value
    - slowlog-log-slower-than
    - slowlog-max-len
    - stop-writes-on-bgsave-error
    - tcp-keepalive
    - timeout
    - zset-max-listpack-entries
    - zset-max-listpack-value
  parametersSchema:
    topLevelKey: ValkeyParameter
    cue: |-
      {{- $.Files.Get (printf "config/redis%s-config-constraint.cue" .major) | nindent 6 }}
{{- end }}
