apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: valkey-physical-br
  labels:
    clusterdefinition.kubeblocks.io/name: valkey
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  backupType: Full
  env:
    - name: DATA_DIR
      value: {{ .Values.dataMountPath }}
    - name: TLS_MOUNT_PATH
      value: {{ .Values.tlsMountPath }}
  backup:
    preBackup: []
    postBackup: []
    backupData:
      image: $(IMAGE)
      runOnTargetPodNode: true
      syncProgress:
        enabled: true
        intervalSeconds: 5
      command:
        - bash
        - -c
        - |
          {{- .Files.Get "dataprotection/backup.sh" | nindent 10 }}
  restore:
    prepareData:
      image: $(IMAGE)
      command:
        - bash
        - -c
        - |
          {{- .Files.Get "dataprotection/switch-data-dir.sh" | nindent 10 }}
          {{- .Files.Get "dataprotection/restore.sh" | nindent 10 }}
    postReady:
      - job:
          image: $(IMAGE)
          onError: Fail
          runOnTargetPodNode: true
          command:
            - bash
            - -c
            - |
              {{- .Files.Get "dataprotection/restore-keys.sh" | nindent 14 }}
---
{{/*
ActionSet for the rebuild-instance flow (KB RebuildFrom) — port of
redis-for-rebuild-instance.  The "backup" intentionally carries no dataset:
the rebuilt pod re-syncs data from the primary via replication, so only
users.acl is captured and re-seeded.  Uses the default valkey image instead
of redis's busybox (same shape, keeps the chart free of an extra image helper);
datasafed itself is provided by the DataProtection job infrastructure.
*/}}
apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: valkey-for-rebuild-instance
  labels:
    clusterdefinition.kubeblocks.io/name: valkey
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  backupType: Full
  env:
    - name: DATA_DIR
      value: {{ .Values.dataMountPath }}
    - name: REBUILD_CLUSTER_INSTANCE
      value: "false"
  backup:
    backupData:
      image: {{ include "valkey.defaultImage" . }}
      runOnTargetPodNode: true
      syncProgress:
        enabled: true
        intervalSeconds: 5
      command:
      - bash
      - -c
      - |
        {{- .Files.Get "dataprotection/backup-for-rebuild.sh" | nindent 8 }}
  restore:
    prepareData:
      image: {{ include "valkey.defaultImage" . }}
      command:
      - bash
      - -c
      - |
        {{- .Files.Get "dataprotection/restore-cluster-users.sh" | nindent 8 }}
