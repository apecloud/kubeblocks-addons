apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: mariadb-pitr
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
spec:
  backupType: Continuous
  env:
    - name: VOLUME_DATA_DIR
      value: /var/lib/mysql
    - name: PITR_DIR
      value: /var/lib/mysql/pitr-logs
    - name: DP_DB_PORT
      value: "3306"
    - name: BINLOG_ARCHIVE_INTERVAL
      value: "10"
    - name: FLUSH_BINLOG_AFTER_SIZE
      value: "524288000"
    - name: FLUSH_BINLOG_INTERVAL_SECONDS
      value: "60"
    - name: IMAGE_TAG
      value: {{ .Values.image.tag | quote }}
  backup:
    backupData:
      image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository }}:$(IMAGE_TAG)
      runOnTargetPodNode: true
      syncProgress:
        enabled: true
        intervalSeconds: 5
      command:
        - bash
        - -c
        - |
          {{- .Files.Get "dataprotection/mariadb-pitr-backup.sh" | nindent 10 }}
  restore:
    postReady:
      - job:
          image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository }}:$(IMAGE_TAG)
          runOnTargetPodNode: true
          command:
            - bash
            - -c
            - |
              {{- .Files.Get "dataprotection/mariadb-pitr-restore.sh" | nindent 14 }}
