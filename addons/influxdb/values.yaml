# Default values for mysql.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""

fullnameOverride: ""

image:
  registry: docker.io
  pullPolicy: IfNotPresent
  influxdb:
    # mirrored from bitnami/influxdb
    repository: apecloud/influxdb
    tag: 2.7.11-debian-12-r18
  init:
    repository: apecloud/os-shell
    tag: 11-debian-11-r93
  influxdbData:
    # mirrored from chengshiwen/influxdb
    repository: apecloud/influxdb
    tag: 1.8.10-c1.1.2-data
  influxdbMeta:
    # mirrored from chengshiwen/influxdb
    repository: apecloud/influxdb
  tools:
    repository: apecloud/curl-jq

configPath: /opt/bitnami/influxdb/etc

clusterDomain: ".cluster.local"
