apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: influxdb-selective
  labels:
    {{- include "influxdb.labels" . | nindent 4 }}
spec:
  backupType: Selective
  env:
    - name: INFLUX_BACKUP_MODE
      value: selective
  parametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        selection:
          type: string
          minLength: 1
          description: 'Comma-separated organization and bucket pairs, e.g. "org1"/"bucket1","org2"/"bucket2". Required for backup. Restore defaults to all buckets in the backup.'
        new_bucket:
          type: string
          minLength: 1
          description: Optional destination bucket name for a single selected bucket. Defaults to the source name and must not already exist.
        new_org:
          type: string
          description: Optional destination organization name.
  backup:
    withParameters: [selection]
    backupData:
      image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.influxdb.repository }}:{{ .Values.image.influxdb.tag }}
      syncProgress:
        enabled: false
        intervalSeconds: 5
      command:
        - bash
        - -c
        - |
          {{- .Files.Get "dataprotection/common.sh" | nindent 10 }}
          {{- .Files.Get "dataprotection/selection.sh" | nindent 10 }}
          {{- .Files.Get "dataprotection/backup.sh" | nindent 10 }}
  restore:
    withParameters: [selection, new_bucket, new_org]
    postReady:
      - job:
          image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.influxdb.repository }}:{{ .Values.image.influxdb.tag }}
          command:
            - bash
            - -c
            - |
              {{- .Files.Get "dataprotection/common.sh" | nindent 14 }}
              {{- .Files.Get "dataprotection/selection.sh" | nindent 14 }}
              {{- .Files.Get "dataprotection/restore.sh" | nindent 14 }}

---
apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: influxdb-export-selective
  labels:
    {{- include "influxdb.labels" . | nindent 4 }}
spec:
  backupType: Selective
  env:
    - name: INFLUX_BACKUP_MODE
      value: export-selective
  parametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        selection:
          type: string
          minLength: 1
          description: 'Comma-separated database or retention policy paths, e.g. "db1","db2"/"30d". A database path selects all its retention policies. Required for backup. Restore defaults to all entries in the backup.'
  backup:
    withParameters:
      - selection
    backupData:
      image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.influxdbData.repository }}:{{ .Values.image.influxdbData.tag | default "1.8.10-c1.1.2-data" }}
      runOnTargetPodNode: true
      syncProgress:
        enabled: false
        intervalSeconds: 5
      command:
        - bash
        - -c
        - |
          export BACKUP_CONCURRENCY={{ .Values.backupConcurrency | default 4 | quote }}
          {{- .Files.Get "dataprotection/cluster-common.sh" | nindent 10 }}
          {{- .Files.Get "dataprotection/selection.sh" | nindent 10 }}
          {{- .Files.Get "dataprotection/cluster-backup.sh" | nindent 10 }}
  restore:
    withParameters:
      - selection
    postReady:
      - job:
          image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.influxdbData.repository }}:{{ .Values.image.influxdbData.tag | default "1.8.10-c1.1.2-data" }}
          command:
            - bash
            - -c
            - |
              {{- .Files.Get "dataprotection/cluster-common.sh" | nindent 14 }}
              {{- .Files.Get "dataprotection/selection.sh" | nindent 14 }}
              {{- .Files.Get "dataprotection/cluster-restore.sh" | nindent 14 }}
