apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: influxdb-full
  labels:
    {{- include "influxdb.labels" . | nindent 4 }}
spec:
  backupType: Full
  backup:
    backupData:
      image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.influxdb.repository }}:{{ .Values.image.influxdb.tag }}
      syncProgress:
        enabled: false
        intervalSeconds: 5
      command:
        - bash
        - -c
        - |
          {{- .Files.Get "dataprotection/common.sh" | nindent 10 }}
          {{- .Files.Get "dataprotection/backup.sh" | nindent 10 }}
  restore:
    postReady:
      - job:
          image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.influxdb.repository }}:{{ .Values.image.influxdb.tag }}
          command:
            - bash
            - -c
            - |
              {{- .Files.Get "dataprotection/common.sh" | nindent 14 }}
              {{- .Files.Get "dataprotection/restore.sh" | nindent 14 }}
