apiVersion: apps.kubeblocks.io/v1
kind: ClusterDefinition
metadata:
  name: {{ include "postgresql.clusterDefinition" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    {{- include "postgresql.apiVersion" . | nindent 4 }}
spec:
  topologies:
    - name: replication
      components:
        - name: postgresql
          compDef: {{ include "postgresql.componentDefNamePrefix" . }}
      default: true
    # The legacy replication topology above intentionally keeps the historical
    # in-pod PgBouncer sidecar for compatibility.  KBE's typed connectionPool
    # contract selects one of the following topologies for new clusters.
    - name: replication-direct
      components:
        - name: postgresql
          compDef: {{ include "postgresql.directComponentDefNamePrefix" . }}
    - name: replication-pgbouncer
      components:
        - name: postgresql
          compDef: {{ include "postgresql.poolerComponentDefNamePrefix" . }}
        - name: pgbouncer
          compDef: {{ include "pgbouncer.componentDefName" . }}
      orders:
        provision:
          - postgresql
          - pgbouncer
        terminate:
          - pgbouncer
          - postgresql
        update:
          - postgresql
          - pgbouncer
