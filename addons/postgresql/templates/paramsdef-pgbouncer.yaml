{{- $effectScope := .Files.Get "config/pgbouncer-config-effect-scope.yaml" | fromYaml }}
apiVersion: parameters.kubeblocks.io/v1alpha1
kind: ParametersDefinition
metadata:
  name: {{ include "pgbouncer.parametersDefinition" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
spec:
  componentDef: {{ include "pgbouncer.componentDefName" . }}
  serviceVersion: {{ .Values.pgbouncer.image.tag | quote }}
  templateName: pgbouncer-configuration
  fileName: pgbouncer.ini
  fileFormatConfig:
    format: ini
    iniConfig:
      sectionName: pgbouncer
  mergeReloadAndRestart: true
  reloadStaticParamsBeforeRestart: false
  parametersSchema:
    topLevelKey: PgBouncerParameters
    cue: |-
      {{- .Files.Get "config/pgbouncer-config-constraint.cue" | nindent 6 }}
  staticParameters:
    {{- range (get $effectScope "staticParameters") }}
    - {{ . }}
    {{- end }}
