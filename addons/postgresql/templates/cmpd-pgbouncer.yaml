apiVersion: apps.kubeblocks.io/v1
kind: ComponentDefinition
metadata:
  name: {{ include "pgbouncer.componentDefName" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
spec:
  provider: kubeblocks
  description: A standalone PgBouncer connection pool for PostgreSQL
  serviceKind: pgbouncer
  serviceVersion: {{ .Values.pgbouncer.image.tag | quote }}
  updateStrategy: Serial
  podManagementPolicy: Parallel
  services:
    - name: pgbouncer
      serviceName: pgbouncer
      spec:
        ports:
          - name: pgbouncer
            port: 6432
            targetPort: pgbouncer
  configs:
    - name: pgbouncer-configuration
      template: {{ include "pgbouncer.componentConfigurationTemplate" . }}
      namespace: {{ .Release.Namespace }}
      volumeName: pgbouncer-config
      defaultMode: 0444
      restartOnFileChange: true
  scripts:
    - name: postgresql-scripts
      template: {{ include "postgresql.scriptsTemplate" . }}
      namespace: {{ .Release.Namespace }}
      volumeName: scripts
      defaultMode: 0555
  vars:
    - name: POSTGRESQL_HOST
      valueFrom:
        serviceVarRef:
          compDef: {{ include "postgresql.poolerComponentDefNamePrefix" . }}
          name: postgresql
          host: Required
          optional: false
    - name: POSTGRESQL_PORT
      valueFrom:
        serviceVarRef:
          compDef: {{ include "postgresql.poolerComponentDefNamePrefix" . }}
          name: postgresql
          port:
            name: tcp-postgresql
            option: Required
          optional: false
    - name: POSTGRESQL_USERNAME
      valueFrom:
        credentialVarRef:
          compDef: {{ include "postgresql.poolerComponentDefNamePrefix" . }}
          name: pgbouncer
          username: Required
          optional: false
    - name: POSTGRESQL_PASSWORD
      valueFrom:
        credentialVarRef:
          compDef: {{ include "postgresql.poolerComponentDefNamePrefix" . }}
          name: pgbouncer
          password: Required
          optional: false
    - name: PGBOUNCER_PROBE_USERNAME
      valueFrom:
        credentialVarRef:
          compDef: {{ include "postgresql.poolerComponentDefNamePrefix" . }}
          name: pgbouncerprobe
          username: Required
          optional: false
    - name: PGBOUNCER_PROBE_PASSWORD
      valueFrom:
        credentialVarRef:
          compDef: {{ include "postgresql.poolerComponentDefNamePrefix" . }}
          name: pgbouncerprobe
          password: Required
          optional: false
  runtime:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    containers:
      - name: pgbouncer
        imagePullPolicy: {{ include "pgbouncer.imagePullPolicy" . }}
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        command:
          - /kb-scripts/pgbouncer-setup.sh
        ports:
          - name: pgbouncer
            containerPort: 6432
            protocol: TCP
        volumeMounts:
          - name: pgbouncer-config
            mountPath: /home/pgbouncer/conf
          - name: scripts
            mountPath: /kb-scripts
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          tcpSocket:
            port: pgbouncer
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          exec:
            command:
              - /bin/sh
              - -ec
              - |
                auth_row="$(PGPASSWORD="$POSTGRESQL_PASSWORD" PGCONNECT_TIMEOUT=3 \
                  psql --no-password --username="$POSTGRESQL_USERNAME" \
                  --host="$POSTGRESQL_HOST" --port="$POSTGRESQL_PORT" \
                  --dbname=postgres --tuples-only --no-align \
                  --command="SELECT count(*) FROM public.pgbouncer_auth('pgbouncerprobe') WHERE username = 'pgbouncerprobe' AND password IS NOT NULL")"
                [ "$auth_row" = "1" ]
                PGPASSWORD="$PGBOUNCER_PROBE_PASSWORD" PGCONNECT_TIMEOUT=3 \
                  exec psql --no-password --username="$PGBOUNCER_PROBE_USERNAME" \
                  --host=127.0.0.1 --port=6432 --dbname=postgres \
                  --tuples-only --no-align --command='SELECT 1'
        env:
          - name: PGBOUNCER_AUTH_TYPE
            value: md5
          - name: PGBOUNCER_PORT
            value: "6432"
          - name: PGBOUNCER_BIND_ADDRESS
            value: "0.0.0.0"
          - name: POSTGRESQL_HOST
            value: $(POSTGRESQL_HOST)
          - name: POSTGRESQL_PORT
            value: $(POSTGRESQL_PORT)
          - name: POSTGRESQL_USERNAME
            value: $(POSTGRESQL_USERNAME)
          - name: POSTGRESQL_PASSWORD
            value: $(POSTGRESQL_PASSWORD)
          - name: PGBOUNCER_PROBE_USERNAME
            value: $(PGBOUNCER_PROBE_USERNAME)
          - name: PGBOUNCER_PROBE_PASSWORD
            value: $(PGBOUNCER_PROBE_PASSWORD)
