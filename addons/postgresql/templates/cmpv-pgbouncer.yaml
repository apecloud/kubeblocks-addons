apiVersion: apps.kubeblocks.io/v1
kind: ComponentVersion
metadata:
  name: {{ include "pgbouncer.componentVersionName" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    {{- include "postgresql.apiVersion" . | nindent 4 }}
spec:
  compatibilityRules:
    - compDefs:
        - {{ include "pgbouncer.componentDefNamePrefix" . }}
      releases:
        - {{ .Values.pgbouncer.standaloneImage.tag | quote }}
  releases:
    - name: {{ .Values.pgbouncer.standaloneImage.tag | quote }}
      serviceVersion: {{ .Values.pgbouncer.standaloneImage.tag | quote }}
      images:
        pgbouncer: {{ include "pgbouncer.image" . }}
