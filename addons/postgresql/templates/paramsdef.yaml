{{- range $version := .Values.versions -}}
{{- $cc := $.Files.Get (printf "config/pg%s-config-effect-scope.yaml" $version.major) | fromYaml }}
{{- $variants := list
      (dict "name" (include "postgresql.parametersDefinition" (dict "major" $version.major "root" $)) "compDef" (include "postgresql.componentDefByMajor" (dict "major" $version.major "root" $)))
      (dict "name" (include "postgresql.directParametersDefinition" (dict "major" $version.major "root" $)) "compDef" (include "postgresql.directComponentDefByMajor" (dict "major" $version.major "root" $)))
      (dict "name" (include "postgresql.poolerParametersDefinition" (dict "major" $version.major "root" $)) "compDef" (include "postgresql.poolerComponentDefByMajor" (dict "major" $version.major "root" $))) }}
{{- range $variant := $variants }}
---
apiVersion: parameters.kubeblocks.io/v1alpha1
kind: ParametersDefinition
metadata:
  name: {{ $variant.name }}
  labels:
    {{- include "postgresql.labels" $ | nindent 4 }}
  annotations:
    {{- include "postgresql.annotations" $ | nindent 4 }}
spec:
  componentDef: {{ $variant.compDef }}
  serviceVersion: {{ $version.serviceVersion }}
  templateName: postgresql-configuration
  fileName: postgresql.conf
  fileFormatConfig:
    format: properties

  mergeReloadAndRestart: false

  # ConfigurationSchema that impose restrictions on engine parameter's rule
  parametersSchema:
    # top level pg configuration type
    topLevelKey: PGParameter

    # schemaInJSON: auto generate from cue scripts
    # example: ../../pkg/configuration/testdata/mysql_openapi.json
    cue: |-
      {{- $.Files.Get (printf "config/pg%s-config-constraint.cue" $version.major) | nindent 6 }}

  ##  require db instance restart
  ## staticParameters
  {{- if hasKey $cc "staticParameters" }}
  staticParameters:
    {{- $params := get $cc "staticParameters" }}
    {{- range $params }}
    - {{ . }}
    {{- end }}
  {{- end}}

  ## define immutable parameter list, this feature is not currently supported.
  {{- if hasKey $cc "immutableParameters" }}
  immutableParameters:
   {{- $params := get $cc "immutableParameters" }}
   {{- range $params }}
    - {{ . }}
   {{- end }}
  {{- end}}
{{- end }}
{{- end }}
