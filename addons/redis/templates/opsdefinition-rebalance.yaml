apiVersion: operations.kubeblocks.io/v1alpha1
kind: OpsDefinition
metadata:
  name: redis-cluster-rebalance
spec:
  componentInfos:
    - componentDefinitionName: ^redis-cluster-.*$
      imageMappings:
        - serviceVersions:
            - 8.6.3
            - 8.4.3
            - 8.4.0
            - 8.2.6
            - 8.2.3
            - 8.2.1
            - 8.2.2
            - 8.0.5
            - 8.0.4
            - 8.0.3
            - 8.0.1
          images:
            redis-rebalance: {{ .Values.image.registry | default "docker.io" }}/{{ include "redis.ceRepository" . }}:8.6.3
  podInfoExtractors:
    - name: redisUrl
      podSelector:
        multiPodSelectionPolicy: Any
      env:
        - name: REDIS_DEFAULT_USER
          valueFrom:
            envRef:
              envName: REDIS_DEFAULT_USER
        - name: REDIS_DEFAULT_PASSWORD
          valueFrom:
            envRef:
              envName: REDIS_DEFAULT_PASSWORD
        - name: CLUSTER_DOMAIN
          valueFrom:
            envRef:
              envName: CLUSTER_DOMAIN
        - name: CURRENT_POD_NAME
          valueFrom:
            envRef:
              envName: CURRENT_POD_NAME
        - name: CURRENT_SHARD_COMPONENT_NAME
          valueFrom:
            envRef:
              envName: CURRENT_SHARD_COMPONENT_NAME
        - name: CLUSTER_NAMESPACE
          valueFrom:
            envRef:
              envName: CLUSTER_NAMESPACE
        - name: SERVICE_PORT
          valueFrom:
            envRef:
              envName: SERVICE_PORT
        - name: REDIS_CLI_TLS_CMD
          optional: true
          valueFrom:
            envRef:
              envName: REDIS_CLI_TLS_CMD
  actions:
    - name: rebalance
      workload:
        type: Job
        podInfoExtractorName: redisUrl
        podSpec:
          containers:
            - name: redis-rebalance
              image: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository }}:7.4.0-v8
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - |
                  {{- .Files.Get "redis-cluster-scripts/redis-rebalance.sh" | nindent 18 }}
          restartPolicy: Never
