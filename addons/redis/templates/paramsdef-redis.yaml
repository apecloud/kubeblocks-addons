# reuse redis7-config-effect-scope.
{{- range .Values.redisVersions }}
{{- $pd := $.Files.Get "config/redis-config-effect-scope.yaml" | fromYaml }}
{{- $major := .major }}
{{- $componentDefs := list
      (dict "pdName" (printf "redis%s-config-pd-%s" $major $.Chart.Version) "componentDef" .componentDef)
      (dict "pdName" (printf "redis%s-syncer-config-pd-%s" $major $.Chart.Version) "componentDef" .syncerComponentDef)
}}
{{- range $componentDef := $componentDefs }}
---
apiVersion: parameters.kubeblocks.io/v1alpha1
kind: ParametersDefinition
metadata:
  name: {{ $componentDef.pdName }}
  labels:
    {{- include "redis.labels" $ | nindent 4 }}
  annotations:
    {{- include "redis.annotations" $ | nindent 4 }}
spec:
  componentDef: {{ printf "^%s$" (printf "%s-%s" $componentDef.componentDef $.Chart.Version | replace "." "[.]") | quote }}
  templateName: redis-replication-config
  fileName: redis.conf
  fileFormatConfig:
    format: redis
  # ConfigurationSchema that impose restrictions on engine parameter's rule
  parametersSchema:
    topLevelKey: RedisParameter
    cue: |-
      {{- $.Files.Get (printf "config/redis%s-config-constraint.cue" $major) | nindent 6 }}

  ## require db instance restart
  {{- if hasKey $pd "staticParameters" }}
  staticParameters:
    {{- $params := get $pd "staticParameters" }}
    {{- range $params }}
    - {{ . }}
    {{- end }}
  {{- end}}
{{- end}}
{{- end}}
