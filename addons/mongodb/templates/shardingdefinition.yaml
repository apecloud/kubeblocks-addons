apiVersion: apps.kubeblocks.io/v1
kind: ShardingDefinition
metadata:
  name: {{ include "mongodbShard.compDefName" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  annotations:
    {{- include "mongodb.annotations" . | nindent 4 }}
spec:
  template:
    compDef: {{ include "mongodbShard.compDefName" . }}
  shardsLimit:
    minShards: 1
    maxShards: 128
  provisionStrategy: Parallel
  updateStrategy: Parallel
  lifecycleActions:
    shardRemove:
      exec:
        container: mongodb
        command:
          - /scripts/mongodb-shard-manage.sh
          - remove-shard
        targetPodSelector: Role
        matchingKey: primary
        # Draining chunks and database primaries can take much longer than the
        # default action timeout. The script polls Syncer's async task and owns
        # the explicit one-hour operation bound.
        timeoutSeconds: -1

