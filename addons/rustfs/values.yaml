## Kubernetes cluster domain
clusterDomain: cluster.local

nameOverride: ""
fullnameOverride: ""

image:
  registry: docker.io
  repository: rustfs/rustfs
  pullPolicy: IfNotPresent

## @param versions RustFS versions configuration
versions:
  - version: "1.0.0-beta.10"
    tag: "1.0.0-beta.10"
    serviceVersion: "1.0.0-beta.10"
    isDefault: true

## Internal port number for RustFS S3 API
rustfsAPIPort: "9000"

## Internal port number for RustFS Console
rustfsConsolePort: "9001"

## TLS certificate path
certsPath: "/etc/rustfs/certs/"

## kblib required values
extra:
  keepResource: true

## Preserve versioned ComponentDefinitions that leave the regular Helm manifest.
migration:
  componentDefinitionRetention:
    image:
      registry: docker.io
      repository: apecloud/kubectl
      tag: "1.29"
      pullPolicy: IfNotPresent
