apiVersion: apps.kubeblocks.io/v1
kind: ComponentVersion
metadata:
  name: seaweedfs-master
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
  annotations:
    {{- include "seaweedfs.annotations" . | nindent 4 }}
spec:
  compatibilityRules:
    - compDefs:
        - {{ include "seaweedfs.cmpdName" (dict "root" . "component" "master-standalone") }}
        - {{ include "seaweedfs.cmpdName" (dict "root" . "component" "master-distributed") }}
      releases:
      {{- range .Values.versions }}
        - {{ printf "seaweedfs-%s" .version }}
      {{- end }}
  releases:
  {{- range .Values.versions }}
    - name: {{ printf "seaweedfs-%s" .version }}
      serviceVersion: {{ .version | quote }}
      images:
        master: {{ printf "%s/%s:%s" $.Values.image.registry $.Values.image.repository .tag }}
        roleProbe: {{ printf "%s/%s:%s" $.Values.image.registry $.Values.image.repository .tag }}
  {{- end }}
