apiVersion: apps.kubeblocks.io/v1
kind: ComponentDefinition
metadata:
  name: {{ include "seaweedfs.cmpdName" (dict "root" . "component" "volume-distributed") }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
  annotations:
    {{- include "seaweedfs.annotations" . | nindent 4 }}
spec:
  provider: kubeblocks
  description: SeaweedFS volume-distributed component.
  serviceKind: seaweedfs
  serviceVersion: {{ .Values.serviceVersion | quote }}
  podManagementPolicy: Parallel
  updateStrategy: Serial
  podUpdatePolicy: ReCreate
  minReadySeconds: 10
  replicasLimit:
    minReplicas: 2
    maxReplicas: 32
  {{- include "seaweedfs.scripts" . | nindent 2 }}
  volumes:
    - name: data
      needSnapshot: false
  services:
    - name: default
      spec:
        ports:
          - name: http
            port: 8080
            targetPort: http
          - name: grpc
            port: 18080
            targetPort: grpc
  vars:
    {{- include "seaweedfs.identityVars" . | nindent 4 }}
    {{- include "seaweedfs.masterVars" . | nindent 4 }}
  lifecycleActions:
    memberLeave:
      timeoutSeconds: 5
      exec:
        image: {{ include "seaweedfs.image" . }}
        container: volume
        command: ["/bin/sh", "/scripts/member-leave-volume.sh"]
  runtime:
    {{- include "seaweedfs.podSecurityContext" . | nindent 4 }}
    terminationGracePeriodSeconds: 60
    containers:
      - name: volume
        image: {{ include "seaweedfs.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/sh", "/scripts/start-volume.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        ports:
          - name: http
            containerPort: 8080
          - name: grpc
            containerPort: 18080
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 6
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6
        volumeMounts:
          - name: scripts
            mountPath: /scripts
            readOnly: true
          - name: data
            mountPath: /data
