image:
  registry: docker.io
  repository: chrislusf/seaweedfs
  tag: "4.48"
  pullPolicy: IfNotPresent

# KubeBlocks requires a semantic serviceVersion; the upstream image tag is 4.48.
serviceVersion: "4.48.0"

# ComponentVersion releases exposed by this addon. The 4.48 candidate is the
# default for the A/B acceptance run; the 4.47 release remains selectable.
versions:
  - version: "4.47.0"
    tag: "4.47"
  - version: "4.48.0"
    tag: "4.48"

# Each SeaweedFS volume file is capped at 1 GiB; -max=0 derives the file count
# from free disk capacity. This is distinct from the Kubernetes PVC capacity.
volumeSizeLimitMB: 1024

extra:
  keepResource: false
