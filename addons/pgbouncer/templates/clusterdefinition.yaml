apiVersion: apps.kubeblocks.io/v1
kind: ClusterDefinition
metadata:
  name: pgbouncer
  labels:
    {{- include "pgbouncer.labels" . | nindent 4 }}
  annotations:
    {{- include "pgbouncer.apiVersion" . | nindent 4 }}
spec:
  topologies:
    {{- range list "rw" "ro" }}
    - name: {{ . }}
      components:
        - name: pgbouncer
          compDef: {{ include "pgbouncer.componentDefNamePrefix" $ }}
      {{- if eq . "rw" }}
      default: true
      {{- end }}
    {{- end }}
