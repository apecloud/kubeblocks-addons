apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgbouncer.scriptsTemplate" . }}
  labels:
    {{- include "pgbouncer.labels" . | nindent 4 }}
  annotations:
    {{- include "pgbouncer.annotations" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "scripts/*" }}
  {{ $path | base }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
